# Validation settings for this repository.
# Gate-control keys below are honoured only from the copy on the default branch.

# Gate agents must not load project-level agent instructions or settings.
disable_project_settings: true

# Every pipeline step for this repository runs on Claude until the ChatGPT weekly quota resets
# (27 Oct 2026), after which it returns to Pi.
agent: claude

document:
  instructions: |
    Follow CONTRIBUTING.md for documentation style and placement.
    Write one sentence per line in Markdown.

review:
  path_instructions:
    - path: "*.go"
      instructions: |
        Review against docs/review.md, citing a requirement id from docs/requirements.md or a rule id from docs/review.md for every finding.
        Check test-first evidence, three-platform behaviour and that no platform or runtime is claimed as supported without acceptance.
    - path: "go.mod"
      instructions: |
        Every new dependency or Go version change must be recorded with its reason in a decision file under docs/decisions/ (docs/review.md rule S7).
    - path: ".github/**"
      instructions: |
        Review against docs/review.md rules S3 and S9: least-privilege permissions, the three-platform matrix, and release publication only from a pushed version tag with every artifact in SHA256SUMS.
    - path: "docs/**"
      instructions: |
        Review against docs/review.md rules S4, S5 and S10: no unproven support claims, no private or personal content, and one sentence per line.

# commands.test is deliberately unset: targeted tests run in the pipeline and the full suite runs in CI.
