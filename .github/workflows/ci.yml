name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Tools and platforms each runner supplies: a test that would skip
        # for one of them fails the job instead (docs/contracts/testenv.md).
        include:
          - os: ubuntu-latest
            require: pwsh
          - os: windows-latest
            require: pwsh,powershell,windows
          - os: macos-latest
            require: ksh,pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test timing policy
        run: go test ./internal/testenv -run '^TestTimingPolicy' -count=1
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          GUILDHALL_CI_REQUIRE: ${{ matrix.require }}
        run: go test ./...
      # The Director suites again, each copy managed with the same effective
      # settings (docs/director-modes.md#testing-both-ways).
      - name: Test Director suites managed
        env:
          GUILDHALL_CI_REQUIRE: ${{ matrix.require }}
          GUILDHALL_TEST_DIRECTOR_MODE: managed
        run: go test ./internal/cli
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: '3.12'
      - name: Install release-policy test dependencies
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip install PyYAML==6.0.1
      - name: Run release-policy test
        if: matrix.os == 'ubuntu-latest'
        run: python .github/tests/test_release.py
      - name: Test with race detector
        if: matrix.os == 'ubuntu-latest'
        env:
          GUILDHALL_CI_REQUIRE: ${{ matrix.require }}
        run: go test -race ./...
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Lanterns presentation contracts
        run: node --test internal/lanterns/plugin/tests/*.test.mjs
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
