name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Tools and platforms each runner supplies: a test that would skip
        # for one of them fails the job instead (docs/contracts/testenv.md).
        include:
          - os: ubuntu-latest
            require: pwsh
          - os: windows-latest
            require: pwsh,powershell,windows
          - os: macos-latest
            require: ksh,pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          GUILDHALL_CI_REQUIRE: ${{ matrix.require }}
        run: |
          set +e
          go test -json ./... > test.json
          status=$?
          set -e
          jq -r 'select(.Test==null and (.Action=="pass" or .Action=="fail")) | "\(.Elapsed)\t\(.Action)\t\(.Package)"' test.json | sort -rn
          echo "--- slowest tests"
          jq -r 'select(.Test!=null and (.Test|contains("/")|not) and (.Action=="pass" or .Action=="fail")) | "\(.Elapsed)\t\(.Action)\t\(.Package|sub(".*guildhall/";""))\t\(.Test)"' test.json | sort -rn | awk 'NR<=60'
          echo "--- failures"
          jq -r 'select(.Action=="fail") | "\(.Package) \(.Test)"' test.json
          exit $status
      - name: Upload test JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-json-${{ matrix.os }}
          path: test.json
