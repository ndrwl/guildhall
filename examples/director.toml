# Example Director config. Paths, remotes and names are placeholders.
schema_version = 1
mode = "director"
name = "tools"

# Owned by this Director; may replace managed keys marked overridable.
[local]
review_instructions = "Cite the accepted requirement for every finding and check Windows paths."
# How long a worker may stay silent before the Director hears it stalled; "0s" turns that off.
stall_interval = "15m"
# Explicit role bindings; renamed/custom profiles inherit artisan-v1 unless bound here.
claude_skills_director = '{"preset":"director-v1"}'
claude_skills_artisan = '{"preset":"artisan-v1"}'
claude_skills_profile_researcher = '{"preset":"artisan-v1"}'
claude_skills_profile_planner = '{"preset":"artisan-v1"}'
claude_skills_profile_builder = '{"preset":"builder-v1"}'
claude_skills_profile_reviewer = '{"preset":"reviewer-v1"}'
claude_skills_profile_rebaser = '{"preset":"builder-v1"}'

# Artisan profiles that workflow steps name with "profile"; no credentials.
# A research, plan, build or Artisan review step that names none runs under its role profile, researcher, planner,
# builder or reviewer, and the merge queue's rebaser under rebaser. Guildhall ships these five on the claude
# adapter with the adapter's default model, so the shipped default and bug workflows run with no [profile.*] here.
# Each shipped profile sets no allowed_tools, so it gets its shipped default grant: read-only git, plus web search
# and fetch for the researcher, committing and rebasing git for the builder and rebaser, and git switch for the
# builder. A section here replaces the shipped profile of that name as a whole; one that sets no allowed_tools
# still gets the shipped grant, so choosing a model or effort keeps the permissions. Setting allowed_tools
# replaces the grant; allowed_tools = [] grants nothing.
# [profile.builder]
# adapter = "claude"
# model = "opus"
# effort = "high"
#
# [profile.reviewer]
# adapter = "claude"
# model = "opus"
# effort = "high"
# role = "roles/reviewer.md"
#
# [profile.rebaser]
# adapter = "claude"
# model = "haiku"
# effort = "low"

[[repository]]
id = "cli"
path = '/srv/src/cli'
remote = "git@github.com:example/cli.git"
owner_machine = "workstation"
# No workflow key: feature tasks run the shipped default and bug tasks the shipped bug workflow.
# No [repository.merge.requires] section: every requirement is on, so the Guildmaster answers every merge.
# A failed GitHub Actions check is re-run once on the same head before the task goes back to build, and a check that
# then passes is a flake the Director files a bug for; this is the default. "rerun" re-runs without the flake
# message, and "off" sends a failed check back to build at once.
# flaky_checks = "rerun-and-file"

# How the merge queue rebases this repository's pull requests; these are the defaults. A rebase at or above
# reapprove_after_rebase (no_conflicts | minor_conflicts | major_conflicts | never) asks the Guildmaster again.
# [repository.merge]
# reapprove_after_rebase = "major_conflicts"
# minor_conflict_files = 3
# minor_conflict_lines = 50

# Repository grants: this Go repository's builder may also run its checks, and its reviewer and rebaser its
# tests, on top of their shipped defaults.
[repository.profiles.builder]
allowed_tools = ["Bash(go test:*)", "Bash(go vet:*)"]

[repository.profiles.reviewer]
allowed_tools = ["Bash(go test:*)"]

[repository.profiles.rebaser]
allowed_tools = ["Bash(go test:*)"]

# A hallmark's read-only stage runs under the researcher profile. Its CI evidence, the merges since the previous
# hallmark and their check runs, arrives in its baseline input, with guildhall ci log for failed checks' logs. A
# researcher grant of go test gives it the tests only: not build, vet, gofmt, lint or -race.
# [repository.profiles.researcher]
# allowed_tools = ["Bash(go test:*)"]

# A hallmark task runs the shipped hallmark workflow; a repository may name its own instead.
# [repository.kinds]
# hallmark = "my-hallmark"

[[repository]]
id = "docs-site"
path = '/srv/src/docs-site'
remote = "https://github.com/example/docs-site.git"
owner_machine = "workstation"

# This repository has the Guildmaster review every change instead of an Artisan.
[repository.workflow_overrides.review]
actor = "guildmaster"

# Guildhall merges this repository's work by itself once the review approves the exact head, CI passes and
# nothing is open; otherwise it asks the Guildmaster. A missing key is true.
[repository.merge.requires]
guildmaster_approval = false
