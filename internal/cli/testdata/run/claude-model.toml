# The Director the claude model-and-effort test runs: the claude Director
# with its planner profile choosing a model and effort from this config alone.
schema_version = 1
mode = "director"
name = "beta"

[local]
standards_revision = "standards-1"

[profile.demo]
adapter = "fake"

[[repository]]
id = "app"
path = "/srv/app"
remote = "git@github.com:example/app.git"
owner_machine = "workstation"
workflow = "claude-straight"

# The workflow's deliver step takes no validation input: the repository runs
# no CI, so ci_green is off.
[repository.merge.requires]
ci_green = false

[profile.planner]
adapter = "claude"
model = "opus"
effort = "high"
