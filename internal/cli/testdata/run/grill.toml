# The Director the step finish tests run: the fake-straight Director with a Director
# grill stage before its plan.
schema_version = 1
mode = "director"
name = "alpha"

[local]
standards_revision = "standards-1"

[profile.demo]
adapter = "fake"

[[repository]]
id = "app"
path = "/srv/app"
remote = "git@github.com:example/app.git"
owner_machine = "workstation"
workflow = "fake-grill"

# The workflow's deliver step takes no validation input: the repository runs
# no CI, so ci_green is off.
[repository.merge.requires]
ci_green = false
