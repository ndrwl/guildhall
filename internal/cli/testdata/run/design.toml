# The Director the task design tests run: the grill Director, with its designer on the fake adapter.
schema_version = 1
mode = "director"
name = "alpha"

[local]
standards_revision = "standards-1"

[profile.demo]
adapter = "fake"

[profile.designer]
adapter = "fake"

[[repository]]
id = "app"
path = "/srv/app"
remote = "git@github.com:example/app.git"
owner_machine = "workstation"
workflow = "fake-grill"

# The workflow's deliver step takes no validation input: the repository runs
# no CI, so ci_green is off.
[repository.merge.requires]
ci_green = false
